---
layout: default
---
<div class="wrapper wrapper-post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      &mdash;
      {% include read-time.html post=page %}
    </p>
    {% if page.tags.size > 0 %}
    <p class="tag-row">
      {% for tag in page.tags %}
      <a class="tag" href="{{ tag | slugify | prepend: '/tags/' | append: '/' | relative_url }}">{{ tag }}</a>
      {% endfor %}
    </p>
    {% endif %}
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <hr />
  <p>
    <a class="arrow-link arrow-link--prev" href="{{ '/' | relative_url }}">back to all posts</a>
  </p>
</div>
