<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />
  {% seo %}
</head>
<body>
  {%- comment -%}
    The home page uses its own ~/mattruggio hero as the header, so the sticky
    bar would just be a duplicate. Interior pages still need a way back.
  {%- endcomment -%}
  {% unless page.url == '/' %}{% include header.html %}{% endunless %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
