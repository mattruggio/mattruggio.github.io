---
layout: default
---
<div class="wrapper">
  <header class="post-header">
    <p class="post-meta">
      {% for item in page.tech %}
      <span class="tag">{{ item }}</span>
      {% endfor %}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-subtitle">{{ page.description }}</p>
    {% endif %}
    <p class="project-links">
      {% if page.site %}<a href="{{ page.site }}" target="_blank" rel="noopener">visit</a>{% endif %}
      {% if page.repo %}<a href="{{ page.repo }}" target="_blank" rel="noopener">source</a>{% endif %}
    </p>
  </header>

  {% if page.image %}
  <img class="project-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}" />
  {% endif %}

  <article class="post-content">
    {{ content }}
  </article>

  <hr />
  <p class="text-muted" style="font-size:0.85rem;">
    <a href="{{ '/projects/' | relative_url }}">&larr; Back to projects</a>
  </p>
</div>
