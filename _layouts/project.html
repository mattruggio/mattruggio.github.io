---
layout: default
---
<div class="wrapper">
  <header class="post-header">
    <p class="post-meta">
      {% for item in page.tech %}
      <span class="tag">{{ item }}</span>
      {% endfor %}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-subtitle">{{ page.description }}</p>
    {% endif %}
    <p class="project-links">
      {% if page.repo %}<a href="{{ page.repo }}" target="_blank" rel="noopener">source</a>{% endif %}
      {% if page.demo %}<a href="{{ page.demo }}" target="_blank" rel="noopener">demo</a>{% endif %}
    </p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <hr />
  <p class="text-muted" style="font-size:0.85rem;">
    <a href="{{ '/portfolio/' | relative_url }}">&larr; Back to portfolio</a>
  </p>
</div>
