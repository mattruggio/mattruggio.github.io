---
layout: default
---
<div class="wrapper wrapper-post">
  <header class="post-header">
    <p class="post-meta prompt">grep -rl "{{ page.title }}" _posts/</p>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.posts.size }} post{% unless page.posts.size == 1 %}s{% endunless %}</p>
  </header>

  {% include post-list.html posts=page.posts current_tag=page.title %}

  <hr />
  <p class="tag-footer-links">
    <a class="arrow-link arrow-link--prev" href="{{ '/tags/' | relative_url }}">all tags</a>
    <a class="arrow-link arrow-link--prev" href="{{ '/articles/' | relative_url }}">all articles</a>
  </p>
</div>
