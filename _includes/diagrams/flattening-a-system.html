<figure class="diagram flatten">

    <title id="flatten-title">One picture is a thin slice taken out of a software system</title>
    <desc id="flatten-desc">A solid cube cut through the middle, with one thin vertical slice drawn part way out of the cut: its upper half stands clear of the cube while its lower half is still buried between the two halves.</desc>

         half extracted: the far half of the cube, then the slice, then the near
         half over the slice's lower portion. Every face is painted opaque
         before it is tinted, since translucent fills let the far half's edges
         show through the near half and the whole thing collapses into a set of
         overlapping planes. -->

      <polygon points="53.45,62.00 58.23,64.76 137.90,18.76 133.12,16.00" fill="var(--bg)" stroke="none"/>
      <polygon points="53.45,62.00 58.23,64.76 137.90,18.76 133.12,16.00" fill="var(--green)" fill-opacity="0.3" stroke="var(--green)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
