title: "Matt Ruggio"
# `tagline` is the short suffix in the browser/search title: "Matt Ruggio | <tagline>".
# jekyll-seo-tag falls back to `description` here, which is too long for a title
# (search engines truncate near 60 characters), so both are set deliberately.
# Kept deliberately informal: this is a personal site, not a consultancy. The
# keyword-bearing phrasing lives in `description` below, where it actually helps.
tagline: "Software engineering and other things"
# `description` drives the meta description and the RSS subtitle, not the title.
description: "Writing about software engineering, system design, and the strategy behind technical decisions."
baseurl: ""
url: "https://rugg.io"
author:
  name: "Matt Ruggio"
  email: ""
  # jekyll-seo-tag copies this onto the JSON-LD Person as `url`.
  url: "https://rugg.io"

# Consumed only by jekyll-seo-tag, which emits `links` as schema.org `sameAs`.
# That is the documented way to tell a search engine these profiles are all the
# same entity, rather than four unrelated accounts that happen to share a name.
#
# Two behaviours worth knowing before editing this:
#
#   1. It is emitted only on the home page and /about, because jekyll-seo-tag
#      gates `links` on `homepage_or_about?`. Posts will not carry it.
#   2. It attaches to the top-level WebSite entity, not to the nested Person.
#      That is the gem's behaviour and is the conventional pattern; a Person
#      with its own `sameAs` would need a hand-written second JSON-LD block.
#
# These duplicate the URLs below rather than referencing them because Jekyll
# does not interpolate inside _config.yml. Keep them in sync by hand.
social:
  name: "Matt Ruggio"
  links:
    - "https://github.com/mattruggio"
    - "https://www.linkedin.com/in/mattruggio"
    - "https://rubygems.org/profiles/mattruggio"
    - "https://music.youtube.com/@mattruggio"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Projects are listed on the home page from _data/projects.yml.
defaults:
  # Social sharing card. jekyll-seo-tag reads `image` from the *page*, never from
  # a top-level site key, so the default has to be applied here. Any page or post
  # can override it with its own `image:` in front matter. Supplying width/height
  # lets the tag emit og:image:width/height, which some crawlers require before
  # they will render a large card.
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-default.png
        width: 1200
        height: 630
        alt: "rugg.io"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor
  - script
  - .cache

# Social links (optional — fill in as desired)
github_username: mattruggio

# Paste your LinkedIn profile URL here to show the link on the home page.
# While this is empty, the link is simply not rendered.
linkedin_url: "https://www.linkedin.com/in/mattruggio"

# YouTube Music profile. Rendered as [ music ] in the whoami links row -- the label
# describes the destination rather than the platform, since the icon already says
# YouTube and "youtube" would imply videos rather than playlists.
# Leave empty to hide the link.
youtube_url: "https://music.youtube.com/@mattruggio"

# GoatCounter site code, i.e. the "CODE" in CODE.goatcounter.com. Sign up at
# https://www.goatcounter.com (free for personal use), then paste the code here.
# While this is empty no analytics script is rendered at all, and it only ever
# loads in production builds so local previews are never counted.
goatcounter_code: "mattruggio"
