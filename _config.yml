title: "Matt Ruggio"
description: "Tech learnings, code, pop culture, and thoughts from the 80s/90s kid who never stopped tinkering."
baseurl: ""
url: "https://mattruggio.github.io"
author:
  name: "Matt Ruggio"
  email: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Projects live in _projects/ as one Markdown file each.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor

# Social links (optional — fill in as desired)
github_username: mattruggio
