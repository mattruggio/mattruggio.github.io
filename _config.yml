title: "Matt Ruggio"
description: "Writing about software engineering, system design, and the strategy behind technical decisions."
baseurl: ""
url: "https://mattruggio.github.io"
author:
  name: "Matt Ruggio"
  email: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Projects are listed on the home page from _data/projects.yml.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor

# Social links (optional — fill in as desired)
github_username: mattruggio

# Paste your LinkedIn profile URL here to show the link on the home page.
# While this is empty, the link is simply not rendered.
linkedin_url: "https://www.linkedin.com/in/mattruggio"
