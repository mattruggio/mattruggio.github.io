# Published RubyGems, shown in the "open source" section of the home page.
#
# Ordered alphabetically, matching what `gem list` actually prints.
#
# `version` is refreshed from the RubyGems API by `script/gems.rb`. The
# `description` fields are hand-written and deliberately NOT taken from each
# gem's published summary, which tends to be several rambling sentences. The
# script preserves them; see its header before editing.
- name: basketball
  version: "0.0.27"
  description: "League simulation domain: drafts, seasons, and playoffs."
  repo: https://github.com/mattruggio/basketball
  gem: https://rubygems.org/gems/basketball
- name: kitkat
  version: "1.0.0"
  description: "Index a directory tree and its metadata into SQLite."
  repo: https://github.com/mattruggio/kitkat
  gem: https://rubygems.org/gems/kitkat
- name: nay
  version: "0.0.3"
  description: "Compile template strings with values pulled from objects."
  repo: https://github.com/mattruggio/nay
  gem: https://rubygems.org/gems/nay
- name: nocode
  version: "0.0.10"
  description: "Compose small Ruby components and wire them together in YAML."
  repo: https://github.com/mattruggio/nocode
  gem: https://rubygems.org/gems/nocode
- name: playoffs
  version: "1.0.1"
  description: "Model and simulate bracket-style tournaments."
  repo: https://github.com/mattruggio/playoffs
  gem: https://rubygems.org/gems/playoffs
- name: primitive
  version: "1.0.1"
  description: "Shared building blocks extracted from the other gems."
  repo: https://github.com/mattruggio/primitive
  gem: https://rubygems.org/gems/primitive
- name: teton
  version: "0.0.3"
  description: "Hierarchical key-value store with pluggable back-ends."
  repo: https://github.com/mattruggio/teton
  gem: https://rubygems.org/gems/teton
